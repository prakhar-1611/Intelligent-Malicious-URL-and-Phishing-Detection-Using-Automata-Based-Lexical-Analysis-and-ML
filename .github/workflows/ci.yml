name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Guard - the engine must not import Python's re module
        run: |
          if grep -rnE "^\s*(import re\b|from re import)" lexer security core api ml adversarial; then
            echo "re is only allowed in tests/ and bench/redos.py"; exit 1; fi
      - name: Build lexer tables (offline construction)
        run: python -m lexer.build_automata
      - name: Tests (equivalence, golden tokens, flags, scanner, email, API)
        run: pytest -q
        env:
          RATE_LIMIT_ENABLED: "0"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
